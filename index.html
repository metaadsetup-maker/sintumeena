<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KS Bhai | Telegram Community Join Karein</title>
<meta name="description" content="KS Bhai ke Telegram community mein join karein - daily gaming updates aur exclusive deals.">

<style>
  :root{
    --bg-0:#0A0C10;
    --bg-1:#12151C;
    --card:#161A23;
    --cyan:#31E7C4;
    --magenta:#FF4D8D;
    --text:#F1F3F7;
    --muted:#8A93A6;
    --line:#242938;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  html,body{
    height:100%;
  }

  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(49,231,196,0.12), transparent 55%),
      radial-gradient(circle at 90% 110%, rgba(255,77,141,0.10), transparent 50%),
      var(--bg-0);
    color:var(--text);
    font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 24px 28px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-60px; left:-60px; right:-60px;
    height:160px;
    background:linear-gradient(120deg, rgba(49,231,196,0.18), rgba(255,77,141,0.10));
    filter:blur(40px);
    pointer-events:none;
  }

  .avatar-wrap{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 18px;
  }

  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--cyan));
    animation:spin 6s linear infinite;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .avatar{
    position:relative;
    width:112px;
    height:112px;
    border-radius:50%;
    background:var(--bg-1);
    border:4px solid var(--bg-1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:1;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .avatar .initials{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:800;
    font-size:34px;
    letter-spacing:1px;
    background:linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .live-dot{
    position:absolute;
    bottom:4px;
    right:4px;
    width:20px;
    height:20px;
    background:var(--cyan);
    border:3px solid var(--bg-1);
    border-radius:50%;
    z-index:2;
    box-shadow:0 0 0 0 rgba(49,231,196,0.6);
    animation:pulse 2s infinite;
  }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(49,231,196,0.55); }
    70%{ box-shadow:0 0 0 10px rgba(49,231,196,0); }
    100%{ box-shadow:0 0 0 0 rgba(49,231,196,0); }
  }

  .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:0.5px;
    margin-bottom:4px;
  }

  .role{
    font-size:13px;
    color:var(--muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:22px;
  }

  .headline{
    font-size:20px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:8px;
  }

  .headline span{
    background:linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtext{
    font-size:14px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:26px;
  }

  .join-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    background:linear-gradient(135deg, var(--cyan), #22c1a8);
    color:#062420;
    font-size:17px;
    font-weight:800;
    text-decoration:none;
    border-radius:14px;
    border:none;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 8px 24px rgba(49,231,196,0.25);
  }

  .join-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(49,231,196,0.35);
  }

  .join-btn:active{
    transform:translateY(0);
  }

  .join-btn svg{
    width:20px;
    height:20px;
    flex-shrink:0;
  }

  .daily-update{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:13.5px;
    color:var(--muted);
    line-height:1.7;
  }

  .daily-update strong{
    color:var(--text);
    display:block;
    font-size:14.5px;
    margin-bottom:4px;
  }

  .footer-note{
    margin-top:18px;
    font-size:11px;
    color:#4E566B;
    letter-spacing:0.3px;
  }
</style>
</head>
<body>

<div class="card">

      <path d="M175.4 68.6L153.8 172c-1.6 7.3-6 9-12.2 5.6l-33.7-24.9-16.3 15.7c-1.8 1.8-3.3 3.3-6.8 3.3l2.4-34.7 63.2-57.1c2.7-2.4-.6-3.8-4.3-1.4l-78.1 49.2-33.6-10.5c-7.3-2.3-7.4-7.3 1.5-10.8l131.5-50.7c6.1-2.3 11.4 1.4 9.4 11.9z" fill="#31E7C4"/>

</div>
